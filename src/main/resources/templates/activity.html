<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Activity Log - CASA Legal Hub</title>

    <!-- CSS LINK -->
    <link rel="stylesheet" th:href="@{/css/style.css}">

    <style>
        .filter-bar {
            display: flex;
            gap: 12px;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
        }

        .filter-bar select,
        .filter-bar input {
            width: auto;
            padding: 8px 12px;
            margin: 0;
        }

        .log-action {
            font-weight: bold;
            font-size: 12px;
            padding: 3px 8px;
            border-radius: 4px;
            color: white;
            display: inline-block;
        }

        .action-ADD_CLIENT, .action-ADD_CASE, .action-ADD_FINANCE, .action-UPLOAD_DOCUMENT {
            background: #38a169;
        }

        .action-UPDATE_CLIENT, .action-UPDATE_CASE, .action-UPDATE_FINANCE {
            background: #dd6b20;
        }

        .action-DELETE_CLIENT, .action-DELETE_CASE, .action-DELETE_FINANCE {
            background: #c53030;
        }

        .action-LOGIN {
            background: #2b6cb0;
        }

        .action-LOGOUT {
            background: #4a5568;
        }

        .module-badge {
            font-size: 11px;
            padding: 2px 7px;
            border-radius: 4px;
            background: #ecf0f1;
            color: #555;
        }

        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 14px;
            margin-bottom: 20px;
        }

        .stat-mini {
            background: white;
            padding: 16px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
            border-left: 4px solid #3498db;
        }

        .stat-mini.green { border-left-color: #27ae60; }
        .stat-mini.red { border-left-color: #e74c3c; }
        .stat-mini.orange { border-left-color: #f39c12; }

        .stat-mini-num {
            font-size: 26px;
            font-weight: bold;
            color: #2c3e50;
        }

        .stat-mini-label {
            font-size: 12px;
            color: #7f8c8d;
            margin-top: 3px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        table th, table td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        table th {
            background: #f4f4f4;
        }

        .btn-cancel {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .btn-cancel:hover {
            background: #c0392b;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div th:replace="~{fragments/nav :: navbar}"></div>

<div class="container">

    <!-- STATS -->
    <div class="stats-row">

        <div class="stat-mini">
            <div class="stat-mini-num" th:text="${#lists.size(logs)}">0</div>
            <div class="stat-mini-label">📋 Total Actions</div>
        </div>

        <div class="stat-mini green">
            <div class="stat-mini-num" th:text="${#lists.size(staffList)}">0</div>
            <div class="stat-mini-label">👤 Active Staff</div>
        </div>

        <div class="stat-mini orange">
            <div class="stat-mini-num"
                 th:text="${#lists.size(logs.?[action == 'ADD_CLIENT' or action == 'UPDATE_CLIENT'])}">
                0
            </div>
            <div class="stat-mini-label">👥 Client Actions</div>
        </div>

        <div class="stat-mini red">
            <div class="stat-mini-num"
                 th:text="${#lists.size(logs.?[action == 'ADD_CASE' or action == 'UPDATE_CASE'])}">
                0
            </div>
            <div class="stat-mini-label">📁 Case Actions</div>
        </div>

    </div>

    <!-- CARD -->
    <div class="card">

        <h2>📋 Staff Activity Log</h2>

        <!-- FILTER BAR -->
        <div class="filter-bar">

            <input type="text"
                   id="searchLog"
                   placeholder="🔍 Search by staff or action..."
                   onkeyup="filterLogs()">

            <select id="filterModule" onchange="filterLogs()">
                <option value="">All Modules</option>
                <option value="CLIENTS">CLIENTS</option>
                <option value="CASES">CASES</option>
                <option value="FINANCE">FINANCE</option>
                <option value="DOCUMENTS">DOCUMENTS</option>
                <option value="AUTH">AUTH</option>
            </select>

            <select id="filterStaff" onchange="filterLogs()">
                <option value="">All Staff</option>
                <option th:each="s : ${staffList}"
                        th:value="${s.email}"
                        th:text="${s.fullName}">
                </option>
            </select>

            <!-- CLEAR FILTERS BUTTON -->
            <button type="button"
                    class="btn-cancel"
                    onclick="clearFilters()"
                    title="Clear filter inputs">
                ✖ Clear Filters
            </button>

            <!-- CLEAR LOGS BUTTON -->
            <button type="button"
                    class="btn-cancel"
                    style="background: #9b59b6;"
                    onclick="clearLogs()"
                    title="Delete logs for selected module or all logs">
                🗑️ Clear Logs
            </button>

        </div>

        <!-- TABLE -->
        <table id="logTable">

            <thead>
            <tr>
                <th>#</th>
                <th>Staff Member</th>
                <th>Email</th>
                <th>Action</th>
                <th>Module</th>
                <th>Details</th>
                <th>IP Address</th>
                <th>Date & Time</th>
            </tr>
            </thead>

            <tbody>

            <tr th:each="log, s : ${logs}">
                <td th:text="${s.count}"></td>
                <td th:text="${log.staffName}"></td>
                <td th:text="${log.staffEmail}"></td>

                <td>
                    <span th:text="${log.action}"
                          th:class="'log-action action-' + ${log.action}">
                    </span>
                </td>

                <td>
                    <span class="module-badge" th:text="${log.module}"></span>
                </td>

                <td th:text="${log.details}"></td>
                <td th:text="${log.ipAddress}"></td>
                <td th:text="${log.timestamp}"></td>
            </tr>

            <tr th:if="${#lists.isEmpty(logs)}">
                <td colspan="8" style="text-align:center;color:#999;">
                    No activity recorded yet.
                </td>
            </tr>

            </tbody>

        </table>

    </div>
</div>

<!-- JAVASCRIPT -->
<script>
function filterLogs() {

    const search = document.getElementById("searchLog").value.toLowerCase();
    const module = document.getElementById("filterModule").value.toLowerCase();
    const staff  = document.getElementById("filterStaff").value.toLowerCase();

    const rows = document.querySelectorAll("#logTable tbody tr");

    rows.forEach(row => {

        const text = row.textContent.toLowerCase();

        const matchSearch = !search || text.includes(search);
        const matchModule = !module || text.includes(module);

        const emailCell = row.cells[2];
        const matchStaff = !staff || (
            emailCell && emailCell.textContent.toLowerCase().includes(staff)
        );

        row.style.display = (matchSearch && matchModule && matchStaff)
            ? "table-row"
            : "none";
    });
}

function clearFilters() {

    document.getElementById("searchLog").value = "";
    document.getElementById("filterModule").value = "";
    document.getElementById("filterStaff").value = "";

    filterLogs();
}

function clearLogs() {
    const module = document.getElementById("filterModule").value;
    
    if (!module) {
        if (!confirm("Are you sure you want to delete ALL activity logs? This action cannot be undone.")) {
            return;
        }
    } else {
        if (!confirm("Are you sure you want to delete all logs for module '" + module + "'?")) {
            return;
        }
    }
    
    const url = module ? "/api/activity/module/" + encodeURIComponent(module) : "/api/activity/all";
    
    fetch(url, { method: "DELETE" })
        .then(response => {
            if (response.ok) {
                location.reload();
            } else {
                alert("Failed to clear logs. Please try again.");
            }
        })
        .catch(() => alert("An error occurred while clearing logs."));
}
</script>

</body>
</html>
